name: iris_payment
description: >-
  Greek IRIS payment QR code generator. Validate AFM (Greek VAT/Tax ID),
  generate IRIS-standard QR data, and render payment QR codes with
  customizable styles, colors, and logo overlay.
version: 0.1.0
homepage: https://orestislef.gr/
repository: https://github.com/orestislef/iris_payment
issue_tracker: https://github.com/orestislef/iris_payment/issues

topics:
  - payments
  - qrcode
  - greece
  - iris
  - fintech

platforms:
  android:
  ios:
  web:
  windows:
  macos:
  linux:

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
